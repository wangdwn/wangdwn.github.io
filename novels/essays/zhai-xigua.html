<style>

* { margin:0; padding:0; box-sizing:border-box; }
body {

}
.container { max-width:640px; margin:0 auto; padding:56px 24px 80px; }
header { text-align:center; margin-bottom:44px; }

</head>
<body>
<div class="container">
  <header>

    <p class="subtitle">童谣</p>
  </header>
  <div class="body">
<p class="poem">嗨呦，</p>
<p class="poem">嗨呦，</p>
<p class="poem">摘西瓜，</p>
<p class="poem">又甜又沙的小西瓜，</p>
<p class="poem">躺在地裡等你呀。</p>

  </div>

<script>
(function(){
  var k=['contextmenu','copy','cut','dragstart','selectstart'];
  k.forEach(function(t){ document.addEventListener(t, function(e){ e.preventDefault(); }); });
  document.addEventListener('keydown', function(e){
    if((e.ctrlKey||e.metaKey) && ['c','x','s','p','a'].includes(e.key.toLowerCase())) e.preventDefault();
  });
})();
