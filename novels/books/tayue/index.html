#gate{position:fixed;inset:0;z-index:99;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px}.gate-box{max-width:340px;width:100%;text-align:center;font-family:-apple-system,"PingFang SC",sans-serif}.gate-title{font-size:22px;letter-spacing:.2em;margin-bottom:8px}.gate-sub{font-size:12.5px;color:var(--muted);margin-bottom:22px}#pw{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:15px;text-align:center;letter-spacing:.1em;outline:none}#go{margin-top:12px;width:100%;padding:11px;border:0;border-radius:8px;background:#1a1a1a;color:#fff;font-size:14px;cursor:pointer}#err{color:#a33;font-size:12px;height:18px;margin-top:8px}.wm{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.038;background-image:repeating-linear-gradient(-32deg,transparent 0 118px,#000 118px 120px)}</style></head><body><div id="gate"><div class="gate-box"><div class="gate-title">他八个月</div><div class="gate-sub">本作品仅限授权阅读，请输入访问口令</div><input id="pw" type="password" autocomplete="off" placeholder="口令"><button id="go" type="button">进入</button><div id="err"></div></div></div><div class="wm"></div><div class="wrap" id="content" style="display:none"><h1>他八个月</h1><div class="sub">二〇一〇 · 广州</div><div class="toc">

</div><div class="foot">他八个月 · 王胜 著</div></div><script>(function(){var K="MjAxMDA4";var gate=document.getElementById("gate"),content=document.getElementById("content");function show(){if(gate)gate.style.display="none";if(content)content.style.display="block";}try{if(sessionStorage.getItem("tayue_ok")==="1"){show();}}catch(e){}var btn=document.getElementById("go"),inp=document.getElementById("pw"),err=document.getElementById("err");function ok(v){try{return btoa(v)===K;}catch(e){return false;}}function tryUnlock(){var v=(inp.value||"").trim();if(!v){if(err)err.textContent="请输入口令";return;}if(ok(v)){try{sessionStorage.setItem("tayue_ok","1");}catch(e){}show();}else{if(err)err.textContent="口令不对";inp.value="";inp.focus();}}if(btn){btn.addEventListener("click",tryUnlock);inp.addEventListener("keydown",function(e){if(e.key==="Enter")tryUnlock();});setTimeout(function(){inp.focus();},200);}})();</script></body></html>
